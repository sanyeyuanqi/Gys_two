name: gys

services:
  postgres:
    image: postgres:16-alpine
    container_name: gys-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gys
      POSTGRES_USER: gys
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - /data/gys-system/postgres:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gys -d gys"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - gys-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
    image: gys-backend:latest
    container_name: gys-backend
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://gys:${POSTGRES_PASSWORD}@gys-postgres:5432/gys
      GYS_PUBLIC_ORIGIN: ${GYS_PUBLIC_ORIGIN:-https://gys.oljvxj.xyz}
      SUPER_ADMIN_INITIAL_PASSWORD: ${SUPER_ADMIN_INITIAL_PASSWORD:-}
      TZ: Asia/Shanghai
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    networks:
      - gys-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend/Dockerfile
    image: gys-frontend:latest
    container_name: gys-frontend
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      GYS_FASTAPI_ORIGIN: http://gys-backend:8000
      TZ: Asia/Shanghai
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    networks:
      - gys-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  gys-network:
    name: gys-network
    external: true
